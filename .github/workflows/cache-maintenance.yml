name: Cache Maintenance

on:
  schedule:
    - cron: "25 18 * * *"
  workflow_dispatch:
    inputs:
      older_than_days:
        description: "Delete caches not accessed for at least this many days"
        required: true
        default: "7"
        type: string
      prefix:
        description: "Only consider caches whose key starts with this prefix"
        required: false
        default: ""
        type: string
      ref:
        description: "Only consider caches for this ref, for example refs/heads/main"
        required: false
        default: "refs/heads/main"
        type: string
      keep_latest:
        description: "Keep this many newest matched caches even if they are old"
        required: true
        default: "1"
        type: string
      artifact_older_than_days:
        description: "Delete non-protected artifacts created at least this many days ago"
        required: true
        default: "2"
        type: string
      artifact_keep_latest_runs:
        description: "Keep artifacts from this many newest firmware-producing runs"
        required: true
        default: "1"
        type: string
      workflow_run_older_than_days:
        description: "Delete completed workflow runs created at least this many days ago"
        required: true
        default: "7"
        type: string
      workflow_run_keep_latest_per_workflow:
        description: "Keep this many newest runs per workflow"
        required: true
        default: "3"
        type: string
      dry_run:
        description: "List artifacts, caches, and workflow runs without deleting them"
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Cleanup Actions Storage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Cleanup Actions Artifacts, Caches, and Workflow Runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          ARTIFACT_OLDER_THAN_DAYS: ${{ inputs.artifact_older_than_days || '2' }}
          ARTIFACT_KEEP_LATEST_RUNS: ${{ inputs.artifact_keep_latest_runs || '1' }}
          CACHE_OLDER_THAN_DAYS: ${{ inputs.older_than_days || '7' }}
          CACHE_PREFIX: ${{ inputs.prefix || '' }}
          CACHE_REF: ${{ inputs.ref || 'refs/heads/main' }}
          CACHE_KEEP_LATEST: ${{ inputs.keep_latest || '1' }}
          WORKFLOW_RUN_OLDER_THAN_DAYS: ${{ inputs.workflow_run_older_than_days || '7' }}
          WORKFLOW_RUN_KEEP_LATEST_PER_WORKFLOW: ${{ inputs.workflow_run_keep_latest_per_workflow || '3' }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/ci/actions-storage-maintenance.sh
