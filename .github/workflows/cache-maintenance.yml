name: Cache Maintenance

on:
  schedule:
    - cron: "25 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "执行模式：preview 仅预览不删除；cleanup 按默认策略立即清理"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - cleanup

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Cleanup Actions Storage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Cleanup Actions Artifacts, Caches, and Workflow Runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' && 'true' || 'false' }}
          ARTIFACT_OLDER_THAN_DAYS: "2"
          ARTIFACT_KEEP_LATEST_RUNS: "1"
          CACHE_OLDER_THAN_DAYS: "7"
          CACHE_PREFIX: ""
          CACHE_REF: refs/heads/main
          CACHE_KEEP_LATEST: "1"
          WORKFLOW_RUN_OLDER_THAN_DAYS: "7"
          WORKFLOW_RUN_KEEP_LATEST_PER_WORKFLOW: "3"
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/ci/actions-storage-maintenance.sh
