name: Cache Maintenance

on:
  schedule:
    - cron: "25 18 * * *"
  workflow_dispatch:
    inputs:
      older_than_days:
        description: "Delete caches not accessed for at least this many days"
        required: true
        default: "7"
        type: string
      prefix:
        description: "Only consider caches whose key starts with this prefix"
        required: false
        default: ""
        type: string
      ref:
        description: "Only consider caches for this ref, for example refs/heads/main"
        required: false
        default: "refs/heads/main"
        type: string
      keep_latest:
        description: "Keep this many newest matched caches even if they are old"
        required: true
        default: "1"
        type: string
      artifact_older_than_days:
        description: "Delete non-protected artifacts created at least this many days ago"
        required: true
        default: "2"
        type: string
      artifact_keep_latest_runs:
        description: "Keep artifacts from this many newest firmware-producing runs"
        required: true
        default: "1"
        type: string
      dry_run:
        description: "List artifacts and caches without deleting them"
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Cleanup Actions Storage
    runs-on: ubuntu-22.04
    steps:
      - name: Cleanup Artifacts
        uses: actions/github-script@v9
        env:
          ARTIFACT_OLDER_THAN_DAYS: ${{ inputs.artifact_older_than_days || '2' }}
          ARTIFACT_KEEP_LATEST_RUNS: ${{ inputs.artifact_keep_latest_runs || '1' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        with:
          script: |
            const artifactOlderThanDays = Number(process.env.ARTIFACT_OLDER_THAN_DAYS);
            const artifactKeepLatestRuns = Number(process.env.ARTIFACT_KEEP_LATEST_RUNS);
            const dryRunInput = process.env.DRY_RUN || "true";
            const dryRun = /^(true|True|TRUE)$/.test(dryRunInput);

            if (!/^(true|True|TRUE|false|False|FALSE)$/.test(dryRunInput)) {
              throw new Error(`dry_run must be true or false, got ${dryRunInput}`);
            }
            if (!Number.isFinite(artifactOlderThanDays) || artifactOlderThanDays < 0) {
              throw new Error(`artifact_older_than_days must be a non-negative number, got ${artifactOlderThanDays}`);
            }
            if (!Number.isInteger(artifactKeepLatestRuns) || artifactKeepLatestRuns < 0) {
              throw new Error(`artifact_keep_latest_runs must be a non-negative integer, got ${artifactKeepLatestRuns}`);
            }

            const cutoff = Date.now() - artifactOlderThanDays * 24 * 60 * 60 * 1000;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = [];
            const formatBytes = (bytes) => `${(bytes / 1024 / 1024).toFixed(2)} MiB`;

            let page = 1;
            while (true) {
              const response = await github.request("GET /repos/{owner}/{repo}/actions/artifacts", {
                owner,
                repo,
                per_page: 100,
                page,
              });
              const pageArtifacts = response.data.artifacts ?? [];
              core.info(`Listed artifact page ${page}: ${pageArtifacts.length} artifacts`);
              artifacts.push(...pageArtifacts);

              const totalCount = response.data.total_count ?? artifacts.length;
              if (pageArtifacts.length === 0 || page * 100 >= totalCount) {
                break;
              }
              page += 1;
            }

            const newestFirmwareRuns = [];
            const firmwareArtifacts = artifacts
              .filter((artifact) => artifact.name.startsWith("firmware-"))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const artifact of firmwareArtifacts) {
              const runId = artifact.workflow_run?.id;
              if (!runId || newestFirmwareRuns.includes(runId)) continue;
              newestFirmwareRuns.push(runId);
              if (newestFirmwareRuns.length >= artifactKeepLatestRuns) break;
            }
            const protectedRuns = new Set(newestFirmwareRuns);

            const candidates = [];
            for (const artifact of artifacts) {
              const createdAt = new Date(artifact.created_at).getTime();
              const runId = artifact.workflow_run?.id;
              const isFirmware = artifact.name.startsWith("firmware-");
              const isSmoke = artifact.name.startsWith("smoke-");

              if (isFirmware) {
                if (!protectedRuns.has(runId)) {
                  candidates.push(artifact);
                }
                continue;
              }
              if (!isSmoke && protectedRuns.has(runId)) {
                continue;
              }
              if (createdAt <= cutoff) {
                candidates.push(artifact);
              }
            }

            candidates.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            const deleteBytes = candidates.reduce((sum, artifact) => sum + artifact.size_in_bytes, 0);
            core.info(`Listed artifacts: ${artifacts.length}`);
            core.info(`Protected firmware runs: ${newestFirmwareRuns.join(", ") || "(none)"}`);
            core.info(`Artifact cleanup candidates: ${candidates.length}`);
            core.info(`Artifact bytes to delete: ${formatBytes(deleteBytes)}`);

            core.summary.addHeading("Artifact cleanup candidates");
            core.summary.addRaw(`Dry run: ${dryRun}\n\n`);
            core.summary.addRaw(`Older than days: ${artifactOlderThanDays}\n\n`);
            core.summary.addRaw(`Keep latest firmware runs: ${artifactKeepLatestRuns}\n\n`);
            core.summary.addRaw(`Protected firmware runs: ${newestFirmwareRuns.join(", ") || "(none)"}\n\n`);
            core.summary.addRaw(`Candidates: ${candidates.length}\n\n`);
            core.summary.addRaw(`Estimated bytes: ${formatBytes(deleteBytes)}\n\n`);

            if (candidates.length === 0) {
              core.summary.addRaw("No artifacts matched.\n");
              await core.summary.write();
              return;
            }

            core.summary.addTable([
              [
                { data: "ID", header: true },
                { data: "Name", header: true },
                { data: "Size", header: true },
                { data: "Created", header: true },
              ],
              ...candidates.map((artifact) => [
                String(artifact.id),
                artifact.name,
                formatBytes(artifact.size_in_bytes),
                artifact.created_at,
              ]),
            ]);

            for (const artifact of candidates) {
              const message = `${dryRun ? "Would delete" : "Deleting"} artifact ${artifact.id}: ${artifact.name}`;
              core.info(message);
              if (!dryRun) {
                await github.request("DELETE /repos/{owner}/{repo}/actions/artifacts/{artifact_id}", {
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
              }
            }

            await core.summary.write();

      - name: Cleanup Caches
        uses: actions/github-script@v9
        env:
          OLDER_THAN_DAYS: ${{ inputs.older_than_days || '7' }}
          CACHE_PREFIX: ${{ inputs.prefix || '' }}
          CACHE_REF: ${{ inputs.ref || 'refs/heads/main' }}
          KEEP_LATEST: ${{ inputs.keep_latest || '1' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        with:
          script: |
            const olderThanDays = Number(process.env.OLDER_THAN_DAYS);
            const prefix = process.env.CACHE_PREFIX || "";
            const ref = process.env.CACHE_REF || "";
            const keepLatest = Number(process.env.KEEP_LATEST);
            const dryRunInput = process.env.DRY_RUN || "true";
            const dryRun = /^(true|True|TRUE)$/.test(dryRunInput);

            if (!/^(true|True|TRUE|false|False|FALSE)$/.test(dryRunInput)) {
              throw new Error(`dry_run must be true or false, got ${dryRunInput}`);
            }

            if (!Number.isFinite(olderThanDays) || olderThanDays < 0) {
              throw new Error(`older_than_days must be a non-negative number, got ${olderThanDays}`);
            }
            if (!Number.isInteger(keepLatest) || keepLatest < 0) {
              throw new Error(`keep_latest must be a non-negative integer, got ${keepLatest}`);
            }
            if (!dryRun && !prefix && !ref) {
              throw new Error("Refusing to delete caches without a prefix or ref filter. Set prefix or ref, or run with dry_run=true.");
            }

            const cutoff = Date.now() - olderThanDays * 24 * 60 * 60 * 1000;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const matched = [];
            const cacheGroupKey = (key) => {
              const parts = key.split("-");
              if (parts[0] === "ccache" && parts[1] === "v2" && parts.length >= 6) {
                return parts.slice(0, 5).join("-");
              }
              if (parts[0] === "build" && parts[1] === "accel" && parts[2] === "v2" && parts.length >= 7) {
                return parts.slice(0, 6).join("-");
              }
              return key;
            };

            let page = 1;
            while (true) {
              const listRequest = {
                owner,
                repo,
                per_page: 100,
                page,
              };
              if (ref) {
                listRequest.ref = ref;
              }

              const response = await github.request("GET /repos/{owner}/{repo}/actions/caches", listRequest);
              const caches = response.data.actions_caches ?? [];
              core.info(`Listed cache page ${page}: ${caches.length} caches`);

              for (const cache of caches) {
                if (prefix && !cache.key.startsWith(prefix)) continue;
                if (ref && cache.ref !== ref) continue;
                matched.push(cache);
              }

              const totalCount = response.data.total_count ?? matched.length;
              if (caches.length === 0 || page * 100 >= totalCount) {
                break;
              }
              page += 1;
            }

            const protectedCaches = new Set();
            const groupCounts = new Map();
            for (const cache of matched.sort((a, b) => new Date(b.last_accessed_at) - new Date(a.last_accessed_at))) {
              const group = cacheGroupKey(cache.key);
              const count = groupCounts.get(group) || 0;
              if (count < keepLatest) {
                protectedCaches.add(cache.id);
              }
              groupCounts.set(group, count + 1);
            }
            const candidates = [];
            for (const cache of matched) {
              if (protectedCaches.has(cache.id)) continue;
              const lastAccessed = new Date(cache.last_accessed_at).getTime();
              if (lastAccessed > cutoff) continue;
              candidates.push(cache);
            }

            candidates.sort((a, b) => new Date(a.last_accessed_at) - new Date(b.last_accessed_at));
            core.info(`Matched caches: ${matched.length}`);
            core.info(`Matched cache groups: ${groupCounts.size}`);
            core.info(`Cleanup candidates: ${candidates.length}`);
            core.summary.addHeading("Cache cleanup candidates");
            core.summary.addRaw(`Dry run: ${dryRun}\n\n`);
            core.summary.addRaw(`Prefix: ${prefix || "(any)"}\n\n`);
            core.summary.addRaw(`Ref: ${ref || "(any)"}\n\n`);
            core.summary.addRaw(`Older than days: ${olderThanDays}\n\n`);
            core.summary.addRaw(`Keep latest per group: ${keepLatest}\n\n`);
            core.summary.addRaw(`Matched caches before retention: ${matched.length}\n\n`);
            core.summary.addRaw(`Matched cache groups: ${groupCounts.size}\n\n`);

            if (candidates.length === 0) {
              core.summary.addRaw("No caches matched.\n");
              await core.summary.write();
              return;
            }

            core.summary.addTable([
              [
                { data: "ID", header: true },
                { data: "Key", header: true },
                { data: "Ref", header: true },
                { data: "Size", header: true },
                { data: "Last accessed", header: true },
              ],
              ...candidates.map((cache) => [
                String(cache.id),
                cache.key,
                cache.ref,
                `${(cache.size_in_bytes / 1024 / 1024).toFixed(2)} MiB`,
                cache.last_accessed_at,
              ]),
            ]);

            for (const cache of candidates) {
              const message = `${dryRun ? "Would delete" : "Deleting"} cache ${cache.id}: ${cache.key}`;
              core.info(message);
              if (!dryRun) {
                await github.rest.actions.deleteActionsCacheById({
                  owner,
                  repo,
                  cache_id: cache.id,
                });
              }
            }

            await core.summary.write();
